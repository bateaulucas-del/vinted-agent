services:
  - type: web
    name: trouve-le-sur-vinted
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: VINTED_AGENT_MODEL
        value: claude-opus-5-5
      - key: CLAUDE_PER_DAY
        value: "300"
      - key: PER_IP_PER_HOUR
        value: "20"
